<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="OpenClaw Web UI">
  <defs>
    <linearGradient id="bg" x1="28" y1="18" x2="228" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111c32"/>
      <stop offset="0.52" stop-color="#080d18"/>
      <stop offset="1" stop-color="#03050b"/>
    </linearGradient>
    <linearGradient id="card" x1="54" y1="56" x2="202" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3156"/>
      <stop offset="1" stop-color="#0b1428"/>
    </linearGradient>
    <linearGradient id="lobster" x1="58" y1="44" x2="198" y2="216" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff6262"/>
      <stop offset="0.48" stop-color="#e93838"/>
      <stop offset="1" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="13" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="14" y="14" width="228" height="228" rx="52" fill="url(#bg)"/>
  <path d="M45 203c40 26 126 27 166 0" fill="none" stroke="#1f345c" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
  <circle cx="204" cy="58" r="8" fill="#00e5cc" opacity="0.95" filter="url(#glow)"/>
  <circle cx="55" cy="197" r="5" fill="#00e5cc" opacity="0.75"/>

  <!-- Native Control UI card, kept subdued so the OpenClaw mark reads first. -->
  <g filter="url(#shadow)">
    <rect x="48" y="62" width="160" height="120" rx="25" fill="url(#card)" stroke="#2e4770" stroke-width="3"/>
    <rect x="66" y="84" width="124" height="70" rx="15" fill="#091222" stroke="#00e5cc" stroke-opacity="0.45" stroke-width="2"/>
    <path d="M82 110h37m17 0h39M82 130h72" stroke="#7df6ff" stroke-width="5" stroke-linecap="round" opacity="0.78"/>
    <path d="M84 143h26" stroke="#ff6262" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  </g>

  <!-- Official-logo-inspired OpenClaw lobster silhouette. -->
  <g transform="translate(38 34) scale(1.5)" filter="url(#shadow)">
    <path d="M60 10 C30 10 15 35 15 55 C15 75 30 95 45 100 L45 110 L55 110 L55 100 C55 100 60 102 65 100 L65 110 L75 110 L75 100 C90 95 105 75 105 55 C105 35 90 10 60 10Z" fill="url(#lobster)"/>
    <path d="M20 45 C5 40 0 50 5 60 C10 70 20 65 25 55 C28 48 25 45 20 45Z" fill="url(#lobster)"/>
    <path d="M100 45 C115 40 120 50 115 60 C110 70 100 65 95 55 C92 48 95 45 100 45Z" fill="url(#lobster)"/>
    <path d="M45 15 Q35 5 30 8" stroke="#ff6262" stroke-width="3.3" stroke-linecap="round" fill="none"/>
    <path d="M75 15 Q85 5 90 8" stroke="#ff6262" stroke-width="3.3" stroke-linecap="round" fill="none"/>
    <circle cx="45" cy="35" r="6.3" fill="#050810"/>
    <circle cx="75" cy="35" r="6.3" fill="#050810"/>
    <circle cx="46" cy="34" r="2.7" fill="#00e5cc"/>
    <circle cx="76" cy="34" r="2.7" fill="#00e5cc"/>
    <path d="M41 71c11 8 27 8 38 0" fill="none" stroke="#7f1717" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
    <path d="M47 88c8 5 18 5 26 0" fill="none" stroke="#7f1717" stroke-width="3" stroke-linecap="round" opacity="0.38"/>
  </g>
</svg>
