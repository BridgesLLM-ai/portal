name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build/check (${{ matrix.lane }}, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Qualified release compiler, not a managed OpenClaw runtime.
          - node-version: 22.22.3
            lane: release-compiler
          # Tested managed-runtime baseline. OpenClaw 2026.10.6 requires
          # >=24.22.1 <25 || >=26.12.1; no Node 25/26 qualification is claimed.
          # This job builds/checks Portal; it does not boot OpenClaw.
          - node-version: 24.22.1
            lane: managed-runtime-baseline

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: ./backend
        run: npx prisma generate

      - name: Type-check backend
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: /api
